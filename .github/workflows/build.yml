name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache stable-diffusion.cpp source
        uses: actions/cache@v4
        with:
          path: third_party/stable-diffusion.cpp
          key: sdcpp-${{ hashFiles('scripts/fetch_sdcpp.sh') }}

      - name: Fetch stable-diffusion.cpp
        run: ./scripts/fetch_sdcpp.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StableAndroid-apk
          path: app/build/outputs/apk/release/*.apk
