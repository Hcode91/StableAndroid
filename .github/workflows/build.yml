name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK; just add what we need.
      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache native dependency sources
        uses: actions/cache@v4
        with:
          path: |
            third_party
            app/src/main/assets/taesd.safetensors
            app/src/main/assets/florence_vocab.json
          key: thirdparty-${{ hashFiles('scripts/fetch_sdcpp.sh') }}

      - name: Fetch stable-diffusion.cpp and Vulkan headers
        run: ./scripts/fetch_sdcpp.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the APK has no network permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          PERMS=$("$AAPT" dump permissions app/build/outputs/apk/release/*.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -qE "INTERNET|ACCESS_NETWORK_STATE"; then
            echo "::error::APK requests network access"; exit 1
          fi
          # No telemetry code or auto-started library components either.
          rm -rf /tmp/apkchk && mkdir /tmp/apkchk && unzip -q app/build/outputs/apk/release/*.apk -d /tmp/apkchk
          if "$AAPT" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/release/*.apk | grep -q "E: provider"; then
            echo "::error::APK contains a content provider (auto-started library code)"; exit 1
          fi
          if strings -a /tmp/apkchk/classes*.dex /tmp/apkchk/lib/*/*.so | grep -qiE "events\.data\.microsoft|OneCollector|Lai/onnxruntime/telemetry|HttpURLConnection"; then
            echo "::error::APK contains telemetry or HTTP client code"; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StableAndroid-apk
          path: app/build/outputs/apk/release/*.apk
